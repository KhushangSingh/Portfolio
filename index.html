<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khushang Singh · Product Designer & UX Engineer</title>
    <meta name="description" content="Portfolio of Khushang Singh · Product Designer and UX Engineer specializing in scalable design systems and high-fidelity product design." />
    <meta name="theme-color" content="#050505" />

    <style>
      #root[data-intro-theme]:empty {
        min-block-size: 100vh;
        background: #050505;
      }

      #root[data-intro-theme="light"]:empty { background: #f8f8f5; }

      .portfolio-startup-message {
        display: grid;
        place-items: center;
        min-block-size: 100vh;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
        background: #050505;
        color: #f8f8f5;
      }

      #root[data-intro-theme="light"] .portfolio-startup-message {
        background: #f8f8f5;
        color: #050505;
      }

      .portfolio-loader {
        --loader-background: #0e0a08;
        --loader-accent: #ff5e1a;
        --loader-lock-time: 160ms;
        --loader-exit-time: 440ms;
        position: fixed;
        inset: 0;
        z-index: 100001;
        place-content: center;
        overflow: hidden;
        padding: 1rem;
        background: var(--loader-background);
        color: var(--loader-accent);
        font-family: "Bricolage Grotesque", sans-serif;
      }

      .portfolio-loader:not([hidden]) {
        display: grid;
      }

      html:has(.portfolio-loader:not([hidden])) {
        overflow: hidden;
      }

      .portfolio-loader[data-theme="light"] { --loader-background: #f6f0eb; }

      .portfolio-loader__announcement {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .portfolio-loader__reels {
        --loader-row-height: 1.45em;
        position: relative;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35em;
        font-size: clamp(1.1rem, 6vw, 5rem);
        font-weight: 720;
        line-height: 1;
      }

      .portfolio-loader__word {
        display: flex;
      }

      .portfolio-loader__reel {
        position: relative;
        inline-size: 0.78em;
        block-size: var(--loader-row-height);
        overflow: hidden;
      }

      .portfolio-loader__reel[data-letter="I"] { inline-size: 0.46em; }

      .portfolio-loader__reel:not([data-locked]) {
        mask-image: linear-gradient(to bottom, transparent, #000 28% 72%, transparent);
      }

      .portfolio-loader__reel:not([data-locked])::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        backdrop-filter: blur(clamp(1px, 0.065em, 4px));
        mask-image: linear-gradient(to bottom, #000, transparent 34% 66%, #000);
      }

      .portfolio-loader__rolling,
      .portfolio-loader__letter {
        position: absolute;
        inset: 0;
        animation-duration: var(--loader-lock-time);
        animation-delay: calc(var(--lock-at) - var(--loader-lock-time));
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        animation-fill-mode: both;
      }

      .portfolio-loader__rolling {
        overflow: hidden;
        opacity: 0.8;
        animation-name: portfolio-loader-roll-out;
      }

      .portfolio-loader__letter {
        animation-name: portfolio-loader-lock-letter;
      }

      .portfolio-loader__reel[data-locked] .portfolio-loader__letter {
        animation: none;
      }

      .portfolio-loader__strip {
        display: block;
        animation: portfolio-loader-roll var(--spin-time) linear infinite;
      }

      .portfolio-loader__strip > span,
      .portfolio-loader__letter {
        display: flex;
        align-items: center;
        justify-content: center;
        block-size: var(--loader-row-height);
      }

      .portfolio-loader__strip > span {
        transform: scaleX(0.79);
      }

      .portfolio-loader__reel[data-letter="I"] .portfolio-loader__strip > span { transform: scaleX(0.48); }

      .portfolio-loader__progress {
        position: absolute;
        inset-inline-end: clamp(.5rem, 2vw, 1.5rem);
        inset-block-end: 0;
        color: var(--loader-accent);
        font-size: clamp(3rem, 14vw, 11rem);
        font-weight: 760;
        font-variant-numeric: tabular-nums;
        letter-spacing: -.07em;
        line-height: .82;
        text-box: trim-end cap alphabetic;
        pointer-events: none;
      }

      @supports not (text-box: trim-end cap alphabetic) {
        .portfolio-loader__progress { translate: 0 .12em; }
      }

      .portfolio-loader__glass {
        position: absolute;
        z-index: 2;
        inset-block-start: 0;
        inset-inline-start: 0;
        inline-size: clamp(3rem, 8.4vw, 7.15rem);
        aspect-ratio: 1;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }

      .portfolio-loader__glass[data-scanning] { opacity: 1; }
      .portfolio-loader[data-phase="expanding"] .portfolio-loader__glass { opacity: 0; }

      .portfolio-loader__glass::before {
        content: "";
        position: absolute;
        inset-inline-start: 78%;
        inset-block-start: 75%;
        inline-size: 54%;
        block-size: 15%;
        border: 1px solid #8a5b46;
        border-radius: 0 35% 35% 0;
        background: linear-gradient(180deg, #ab7659 0%, #43281e 29%, #211611 62%, #684735 100%);
        box-shadow: inset -.28em 0 #a57353, 0 .15em .38em #180d08a6;
        transform: rotate(40deg);
        transform-origin: left center;
      }

      .portfolio-loader__lens {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        border: clamp(2px, .35vw, 5px) solid #72503e;
        border-block-start-color: #c69775;
        border-block-end-color: #38251d;
        border-radius: 50%;
        background: var(--loader-accent);
        box-shadow: 0 0 0 1px #241810, 0 .2em .75em #1009038c, inset 0 0 .35em #6a230a;
      }

      .portfolio-loader__lens .portfolio-loader__reels {
        position: absolute;
        inset-block-start: 50%;
        inset-inline-start: 50%;
        color: #8e3518;
        transform-origin: top left;
      }

      .portfolio-loader__lens::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        background: radial-gradient(ellipse at 31% 18%, #fff8d64d, transparent 42%);
        box-shadow: inset 0 0 0 1px #ffe1b88c, inset 0 -.13em .45em #762a13a8;
        pointer-events: none;
      }

      .portfolio-loader__lens-clue {
        position: absolute;
        z-index: 2;
        color: #35150a;
        font-size: clamp(.39rem, .74vw, .68rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: .07em;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 0 .4em #ff9656, 0 0 .9em #ff9656;
      }

      .portfolio-loader[data-phase="revealing"] {
        background: var(--loader-accent);
        animation: portfolio-loader-exit var(--loader-exit-time) ease-out both;
      }

      .portfolio-loader[data-phase="revealing"] :is(.portfolio-loader__reels, .portfolio-loader__progress, .portfolio-loader__glass) {
        visibility: hidden;
      }

      @keyframes portfolio-loader-roll {
        to { transform: translateY(calc(-100% + var(--loader-row-height))); }
      }

      @keyframes portfolio-loader-roll-out {
        to { transform: translateY(-100%); }
      }

      @keyframes portfolio-loader-lock-letter {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      @keyframes portfolio-loader-exit {
        0%, 14% { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .portfolio-loader {
          --loader-lock-time: 1ms;
          --loader-exit-time: 200ms;
        }

        .portfolio-loader__rolling,
        .portfolio-loader__letter { animation-timing-function: step-end; }
        .portfolio-loader__strip { animation: none; }
        .portfolio-loader__glass { display: none; }

        .portfolio-loader__reel:not([data-locked]) { mask-image: none; }
        .portfolio-loader__reel:not([data-locked])::after { content: none; }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter+Tight:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="portfolio-loader" class="portfolio-loader" role="status" hidden>
      <span class="portfolio-loader__announcement">Opening Khushang Singh’s portfolio</span>
      <div class="portfolio-loader__reels" aria-hidden="true"></div>
      <div class="portfolio-loader__progress" aria-hidden="true">0%</div>
      <div class="portfolio-loader__glass" aria-hidden="true">
        <div class="portfolio-loader__lens">
          <span class="portfolio-loader__lens-clue">Look<br>closer</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const route = window.location.pathname.replace(/\/+$/, '').toLowerCase();
        if (route !== '' && route !== '/designer') return;

        const name = 'KHUSHANG SINGH';
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const spinLeadIn = 160;
        const lockInterval = 200;
        const nameHold = 700;
        const zoomDuration = 1100;
        const loader = document.getElementById('portfolio-loader');
        const reels = loader.querySelector('.portfolio-loader__reels');
        const app = document.getElementById('root');
        let theme = 'dark';

        try {
          if (localStorage.getItem('portfolio-theme') === 'light') theme = 'light';
        } catch {
          // Keep the dark default if storage is unavailable.
        }

        function createSpan(className, text = '') {
          const span = document.createElement('span');
          span.className = className;
          span.textContent = text;
          return span;
        }

        const letterReels = [];

        for (const word of name.split(' ')) {
          const group = createSpan('portfolio-loader__word');

          for (const letter of word) {
            const reel = createSpan('portfolio-loader__reel');
            reel.dataset.letter = letter;
            const rolling = createSpan('portfolio-loader__rolling');
            const strip = createSpan('portfolio-loader__strip');
            const target = createSpan('portfolio-loader__letter', letter);
            const pool = [...alphabet];
            pool.splice(pool.indexOf(letter), 1);

            const glyphs = Array.from({ length: 8 }, () => {
              const index = Math.floor(Math.random() * pool.length);
              return pool.splice(index, 1)[0];
            });

            // Repeat the first glyph so the upward loop joins at the same position.
            strip.append(...[...glyphs, glyphs[0]].map((glyph) => createSpan('', glyph)));
            strip.style.setProperty('--spin-time', `${850 + Math.floor(Math.random() * 300)}ms`);
            rolling.append(strip);
            reel.append(rolling, target);
            letterReels.push(reel);
            reel.style.setProperty('--lock-at', `${spinLeadIn + letterReels.length * lockInterval}ms`);
            group.append(reel);
          }

          reels.append(group);
        }

        const lockDuration = spinLeadIn + letterReels.length * lockInterval;
        const progressText = loader.querySelector('.portfolio-loader__progress');
        const glass = loader.querySelector('.portfolio-loader__glass');
        const lens = glass.querySelector('.portfolio-loader__lens');
        const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
        let magnifiedReels;
        let magnifiedLetters = [];
        let scanPoints = [];
        let wordmark;
        let glassSize;
        let detailsFrame;

        function measureScanPath() {
          if (loader.dataset.phase) return;

          wordmark = reels.getBoundingClientRect();
          glassSize = glass.offsetWidth;
          magnifiedReels.style.inlineSize = `${wordmark.width}px`;
          const surnameInitial = letterReels.indexOf(reels.lastElementChild.firstElementChild);

          scanPoints = letterReels.slice(0, surnameInitial + 1).map((reel) => {
            const { left, top, width, height } = reel.getBoundingClientRect();
            return { x: left + width / 2, y: top + height / 2 };
          });
        }

        function drawGlass(elapsed) {
          const growDuration = 320;
          const approachEnd = 500;
          const growth = Math.min(1, elapsed / growDuration);
          const growEase = 1 - (1 - growth) ** 3;
          const approach = Math.min(1, Math.max(0, (elapsed - growDuration) / (approachEnd - growDuration)));
          const glide = approach * approach * (3 - 2 * approach);
          const scanProgress = Math.min(1, Math.max(0, (elapsed - approachEnd) / (lockDuration - approachEnd)));
          const last = scanPoints.length - 1;
          const position = scanProgress * scanProgress * (3 - 2 * scanProgress) * last;
          const segment = Math.min(Math.floor(position), last - 1);
          const blend = position - segment;
          const from = scanPoints[segment];
          const to = scanPoints[segment + 1];
          const x = from.x + (to.x - from.x) * blend;
          const y = from.y + (to.y - from.y) * blend;
          const startX = Math.max(glassSize * .5 + 4, scanPoints[0].x - glassSize * .72);
          const centerX = x + (startX - scanPoints[0].x) * (1 - glide);
          const hover = glassSize * (.28 + .055 * Math.sin(Math.PI * blend) ** 2);
          const scale = .035 + .965 * growEase;
          const zoom = 2.6;

          glass.style.transform = `translate3d(${centerX}px, ${y - hover}px, 0) translate(-50%, -50%) scale(${scale})`;
          magnifiedReels.style.transform = `translate3d(${(wordmark.left - centerX) * zoom}px, ${(wordmark.top - y) * zoom}px, 0) scale(${zoom})`;
        }

        function drawIntroDetails(now) {
          const elapsed = Math.max(0, now - startTime);
          const percent = Math.min(100, Math.floor(elapsed / lockDuration * 100));
          const label = `${percent}%`;
          if (progressText.textContent !== label) progressText.textContent = label;
          if (scanPoints.length && !motionPreference.matches) drawGlass(elapsed);
          if (elapsed < lockDuration) detailsFrame = requestAnimationFrame(drawIntroDetails);
        }

        const lastReel = letterReels.at(-1);
        const zoomReel = letterReels.find((reel) => reel.dataset.letter === 'I');
        let introReady = false;
        let bootstrapReady = false;
        let readinessTimeout;

        function leave() {
          window.clearTimeout(readinessTimeout);
          if (loader.dataset.phase) return;
          loader.dataset.phase = 'expanding';
          window.setTimeout(expandName, nameHold);
        }

        function reveal() {
          loader.dataset.phase = 'revealing';
          document.dispatchEvent(new Event('portfolio-intro-finished'));
        }

        function expandName() {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || typeof reels.animate !== 'function') {
            reveal();
            return;
          }

          const wordmark = reels.getBoundingClientRect();
          const letter = zoomReel.getBoundingClientRect();
          const x = letter.left + letter.width / 2;
          const y = letter.top + letter.height / 2;
          const fontSize = Number.parseFloat(getComputedStyle(reels).fontSize);
          // Even a thin I stem should extend well beyond the edges at full zoom.
          const zoom = Math.max(32, Math.ceil(36 * Math.max(loader.clientWidth, loader.clientHeight) / fontSize));

          reels.style.transformOrigin = `${x - wordmark.left}px ${y - wordmark.top}px`;
          const shiftX = loader.clientWidth / 2 - x;
          const shiftY = loader.clientHeight / 2 - y;
          const steps = 72;
          const frames = Array.from({ length: steps + 1 }, (_, index) => {
            const time = index / steps;
            const scale = Math.pow(zoom, time * time);
            // Tie the pan to the zoom so the I approaches center without stopping between frames.
            const pan = (1 - 1 / scale) / (1 - 1 / zoom);
            return { transform: `translate(${shiftX * pan}px, ${shiftY * pan}px) scale(${scale})` };
          });
          reels.animate(frames, { duration: zoomDuration, fill: 'forwards' }).finished.then(reveal, reveal);
        }

        function handleBootstrapReady() {
          bootstrapReady = true;
          if (introReady) leave();
        }

        function lockReel(reel) {
          if ('locked' in reel.dataset) return;
          reel.querySelector('.portfolio-loader__rolling').remove();
          reel.dataset.locked = '';

          const sample = magnifiedLetters[letterReels.indexOf(reel)];
          if (sample) {
            sample.querySelector('.portfolio-loader__rolling').remove();
            sample.dataset.locked = '';
          }

          if (reel === lastReel) {
            introReady = true;
            if (bootstrapReady) leave();
            else readinessTimeout = window.setTimeout(leave, 8000);
          }
        }

        function handleLetterLock(event) {
          if (event.animationName === 'portfolio-loader-lock-letter') lockReel(event.target.parentElement);
        }

        function syncElapsedLocks() {
          if (document.hidden) return;

          // A background tab can defer animation events until it becomes visible again.
          const elapsed = performance.now() - startTime;
          const lockedCount = Math.max(0, Math.floor((elapsed - spinLeadIn) / lockInterval));
          letterReels.slice(0, lockedCount).forEach(lockReel);
        }

        loader.addEventListener('animationend', (event) => {
          if (event.target !== loader || event.animationName !== 'portfolio-loader-exit') return;
          document.removeEventListener('portfolio-bootstrap-ready', handleBootstrapReady);
          document.removeEventListener('visibilitychange', syncElapsedLocks);
          window.removeEventListener('resize', measureScanPath);
          cancelAnimationFrame(detailsFrame);
          loader.remove();
        });
        reels.addEventListener('animationend', handleLetterLock);
        document.addEventListener('portfolio-bootstrap-ready', handleBootstrapReady, { once: true });
        document.addEventListener('visibilitychange', syncElapsedLocks);

        loader.dataset.theme = theme;
        app.dataset.introTheme = theme;
        const startTime = performance.now();
        loader.hidden = false;

        if (!motionPreference.matches) {
          magnifiedReels = reels.cloneNode(true);
          magnifiedLetters = [...magnifiedReels.querySelectorAll('.portfolio-loader__reel')];
          lens.prepend(magnifiedReels);
          measureScanPath();
          drawGlass(0);
          glass.dataset.scanning = '';
          window.addEventListener('resize', measureScanPath, { passive: true });
        }
        detailsFrame = requestAnimationFrame(drawIntroDetails);
      })();
    </script>

  </body>
